version: "3.9"

# NOTA IMPORTANTE:
# La base de datos SQL Server YA EXISTE en otro servidor (no se levanta aquí).
# Este compose solo levanta backend (Flask) y frontend (Vue).
# La conexión al SQL Server remoto se configura vía variables de entorno (.env)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iph_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - pdf_output:/app/app/generated_pdfs
    networks:
      - iph_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    container_name: iph_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - iph_network

volumes:
  pdf_output:

networks:
  iph_network:
    driver: bridge
